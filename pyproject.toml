[project]
name = "evidence-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.2",
    "numpy==2.5.4",
    "psutil==7.2.2",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[project.scripts]
evidence-rag = "evidence_rag.cli:main"

[project.optional-dependencies]
ml = [
    "huggingface-hub==2.2.0",
    "lm-format-enforcer==0.11.3",
    "sentence-transformers==5.7.0",
    "torch==2.14.1",
    "transformers==5.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.runtime/pytest -m 'not real_model'"
markers = ["real_model: explicit local model execution"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "httpx2==2.13.1",
    "lm-format-enforcer==0.11.3",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-socket==0.8.1",
    "ruff==0.17.1",
]
