name: Local fixture verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.runtime/uv-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.runtime/ms-playwright
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12.14'
          enable-cache: false
      - run: uv sync --frozen
      - run: npm --prefix web ci
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - run: ./scripts/check.sh
      - run: npm --prefix web run test:e2e
      - run: uv run evidence-rag evaluate --profile fixture --split test --generation extractive --output .runtime/ci-evaluation
